<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABSENSI YANTEK ULP DOLOKSANGGUL</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; }
    button { background: #0084ff; color: white; border: none; border-radius: 8px; }
    h2 { text-align: center; color: #0084ff; }
  </style>
</head>
<body>
  <h2>ABSENSI YANTEK ULP DOLOKSANGGUL</h2>
  <input type="text" id="nama" placeholder="Nama Lengkap">
  <button onclick="absenMasuk()">Absen Masuk</button>
  <button onclick="absenPulang()">Absen Pulang</button>
  <p id="status"></p>

  <script>
    function getWaktu() {
      return new Date().toLocaleString('id-ID');
    }
    function absenMasuk() {
      const nama = document.getElementById('nama').value;
      if(!nama) return alert('Isi nama dulu');
      document.getElementById('status').innerText = `${nama} absen masuk: ${getWaktu()}`;
    }
    function absenPulang() {
      const nama = document.getElementById('nama').value;
      if(!nama) return alert('Isi nama dulu');
      document.getElementById('status').innerText = `${nama} absen pulang: ${getWaktu()}`;
    }
  </script>
</body>
</html>
